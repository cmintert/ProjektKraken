name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
          python -m pip install -r requirements.txt

      - name: Run smoke suite
        run: |
          python -m pytest -m smoke -q --maxfail=1 \
            --junitxml=test-results-smoke.xml

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-report
          path: test-results-smoke.xml

  fast-regression:
    name: Fast Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
          python -m pip install -r requirements.txt

      - name: Run fast suite
        run: |
          python -m pytest -m "not slow" \
            --junitxml=test-results-fast.xml \
            --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload fast suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-regression-artifacts
          path: |
            test-results-fast.xml
            coverage.xml
