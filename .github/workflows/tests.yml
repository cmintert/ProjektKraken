name: Tests

on:
  push:
    branches: ["**"]
    tags: ["*-beta*"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
          python -m pip install -r requirements.txt

      - name: Run smoke suite
        run: |
          python -m pytest -m smoke -q --maxfail=1 \
            --junitxml=test-results-smoke.xml

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-report
          path: test-results-smoke.xml

  fast-regression:
    name: Fast PR Regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
          python -m pip install -r requirements.txt

      - name: Run curated PR regression suite
        run: |
          python -m pytest -m ci_fast -q --maxfail=1 \
            --durations=20 --junitxml=test-results-fast.xml

      - name: Upload fast suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-regression-artifacts
          path: |
            test-results-fast.xml

  full-regression:
    name: Full Regression and Coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
          python -m pip install -r requirements.txt

      - name: Run full regression suite with coverage
        run: |
          python -m pytest --durations=50 \
            --junitxml=test-results-full.xml \
            --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload full regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-regression-artifacts
          path: |
            test-results-full.xml
            coverage.xml
