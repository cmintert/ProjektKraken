name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt pytest-cov pytest-xdist
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0

      - name: Run smoke suite
        run: |
          python -m pytest -m smoke -q --maxfail=1 \
            --junitxml=test-results-smoke.xml

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: test-results-smoke.xml

  fast-regression:
    name: Fast Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt pytest-cov pytest-xdist
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0

      - name: Run fast suite in parallel
        run: |
          python -m pytest -m "not slow" -n auto --dist=loadfile \
            --junitxml=test-results-fast.xml \
            --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload fast suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-regression-artifacts
          path: |
            test-results-fast.xml
            coverage.xml
