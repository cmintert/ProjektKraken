# Small remote safety net: broad verification lives in the local pre-push hook.
name: Smoke CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_regression:
        description: "Run full regression and coverage (manual fallback)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event_name }}-${{ github.ref }}-${{ inputs.full_regression && github.run_id || 'lean' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full_regression) }}

jobs:
  smoke:
    name: Smoke and lightweight quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install headless Qt libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
      - name: Install dependencies without embeddings or docs
        run: python -m pip install -r requirements/dev.txt
      - name: Repository-wide Ruff
        run: python -m ruff check
      - name: Changed-source policies
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          python -m scripts.check_complexity_policy --base-ref "$BASE_REF"
          python -m scripts.check_visual_policy --base-ref "$BASE_REF"
      - name: Inspection Help review
        run: python -m scripts.check_help_inspection
      - name: Small smoke suite
        run: python -m pytest -m smoke -q --maxfail=1

  release-plan:
    name: Plan full release regression
    if: github.event_name == 'workflow_dispatch' && inputs.full_regression
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-test-environment
      - name: Collect and freeze complete release inventory
        if: github.run_attempt == 1
        run: python -m scripts.release_regression plan --output artifacts/release-plan/plan.json
      - uses: actions/download-artifact@v4
        if: github.run_attempt > 1
        with:
          name: release-plan-${{ github.run_id }}
          path: artifacts/release-plan
      - uses: actions/upload-artifact@v4
        if: github.run_attempt == 1
        with:
          name: release-plan-${{ github.run_id }}
          path: artifacts/release-plan
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-setup-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-setup
          retention-days: 30

  release-shards:
    name: Release shard ${{ matrix.shard }}
    needs: release-plan
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/release-test-environment
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ github.run_id }}
          path: artifacts/release-plan
      - name: Run modules in fresh supervised processes
        env:
          PK_SHARD: ${{ matrix.shard }}
        run: >-
          python -m scripts.release_regression run-shard
          --plan artifacts/release-plan/plan.json --output artifacts/release-evidence
          --shard "$PK_SHARD" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve complete and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-evidence
            artifacts/release-setup
          if-no-files-found: error
          retention-days: 30

  recovery-review:
    name: Review release regression recovery
    needs: [release-plan, release-shards]
    if: github.run_attempt > 1 && needs.release-shards.result == 'success'
    environment: release-regression-recovery
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record approval and required failure explanation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release_regression github-review --output artifacts/release-review/review.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-review
          if-no-files-found: error
          retention-days: 30

  release-verification:
    name: Release verification
    needs: [release-plan, release-shards, recovery-review]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.full_regression
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest-cov==7.0.0
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ github.run_id }}
          path: artifacts/release-plan
      - name: Download every retained shard attempt
        uses: actions/download-artifact@v4
        with:
          pattern: release-shard-*-${{ github.run_id }}-*
          path: artifacts/release-evidence
      - uses: actions/download-artifact@v4
        if: github.run_attempt > 1
        with:
          name: release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-review
      - name: Verify exhaustive execution and combine coverage
        env:
          PK_ATTEMPT: ${{ github.run_attempt }}
          PK_SHARD_RESULT: ${{ needs.release-shards.result }}
        run: |
          review=()
          if [ "$PK_ATTEMPT" -gt 1 ]; then
            review=(--review artifacts/release-review/review.json)
          fi
          python -m scripts.release_regression aggregate \
            --plan artifacts/release-plan/plan.json \
            --evidence artifacts/release-evidence --output artifacts/release-summary \
            --upstream-result "$PK_SHARD_RESULT" \
            "${review[@]}"
      - name: Explain missing infrastructure evidence
        if: failure()
        run: echo 'Release verification FAILED. Missing setup, plan, shard, review or coverage evidence blocks release. Inspect job logs and retained artifacts.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-summary
          if-no-files-found: error
          retention-days: 30
