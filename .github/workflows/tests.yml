# Small remote safety net: broad verification lives in the local pre-push hook.
name: Smoke CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_regression:
        description: "Run full regression and coverage (manual fallback)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke and lightweight quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install headless Qt libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
      - name: Install dependencies without embeddings or docs
        run: python -m pip install -r requirements/dev.txt
      - name: Repository-wide Ruff
        run: python -m ruff check
      - name: Changed-source policies
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          python -m scripts.check_complexity_policy --base-ref "$BASE_REF"
          python -m scripts.check_visual_policy --base-ref "$BASE_REF"
      - name: Small smoke suite
        run: python -m pytest -m smoke -q --maxfail=1

  full-manual:
    name: Manual full regression
    if: github.event_name == 'workflow_dispatch' && inputs.full_regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install headless Qt libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.check_test_policy
      - name: Full regression with coverage
        run: python -m pytest --maxfail=1 --durations=30 --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-full-coverage
          path: coverage.xml
          if-no-files-found: ignore
