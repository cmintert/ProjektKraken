name: Release infrastructure verification

on:
  workflow_dispatch:
    inputs:
      shared_order_probe:
        description: "Also run the expensive shared-process Qt lifetime diagnostic"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  adversarial:
    name: Disposable release faults (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/dev.txt
            requirements/runtime.txt
      - name: Install Linux Qt support
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libdbus-1-3
      - run: python -m pip install -r requirements/dev.txt
      - name: Exercise assertion, abort, timeout, missing evidence and recovery
        run: >-
          python -m pytest tests/cli/test_release_regression.py
          tests/cli/test_preflight.py tests/unit/test_test_policy.py
          tests/packaging/test_windows_package_contract.py
          -q --tb=short --basetemp=artifacts/release-infrastructure/probes
          --junitxml=artifacts/release-infrastructure/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-infrastructure-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-infrastructure
          if-no-files-found: error
          retention-days: 30

  linux-reproductions:
    name: Linux release failure reproductions
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-test-environment
      - name: Reproduce each reported failure in its own process
        run: |
          mkdir -p artifacts/release-diagnostics
          cases=(
            'tests/unit/test_action_label_integrity.py::test_populated_explorer_keeps_filter_row_compact_and_list_expansive'
            'tests/unit/test_focus_writing.py::test_repeated_entry_restores_width_and_chrome[event]'
            'tests/unit/test_llm_providers.py::test_lmstudio_circuit_breaker'
          )
          result=0
          for index in "${!cases[@]}"; do
            for mode in original production-qss; do
              command=(python -m pytest)
              if [ "$mode" = production-qss ]; then
                command=(python -m scripts.release_regression.qss_probe)
              fi
              export PK_RELEASE_PROGRESS="$PWD/artifacts/release-diagnostics/probe-$index-$mode.jsonl"
              "${command[@]}" "${cases[$index]}" -vv -s \
                -p scripts.release_regression.plugin -o faulthandler_timeout=120 \
                --junitxml="artifacts/release-diagnostics/probe-$index-$mode.xml" \
                > "artifacts/release-diagnostics/probe-$index-$mode.log" 2>&1 || result=1
            done
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-failure-reproductions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-diagnostics
            artifacts/release-setup
          if-no-files-found: error
          retention-days: 30

  shared-order-probe:
    name: Shared-process Qt lifetime diagnostic
    if: inputs.shared_order_probe
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-test-environment
      - name: Probe accumulated GUI state before provider tests
        run: |
          mkdir -p artifacts/release-diagnostics
          export PK_RELEASE_PROGRESS="$PWD/artifacts/release-diagnostics/shared-order.jsonl"
          timeout --signal=TERM --kill-after=15s 2400s \
            python -m pytest -vv -s -p scripts.release_regression.plugin \
              -o faulthandler_timeout=120 --durations=30 \
              tests/unit/test_connections_overview.py tests/unit/test_creation_ux.py \
              tests/unit/test_editor_presentation.py tests/unit/test_focus_writing.py \
              tests/unit/test_inspector_composition.py tests/unit/test_llm_providers.py \
              --junitxml=artifacts/release-diagnostics/shared-order.xml \
              > artifacts/release-diagnostics/shared-order.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-shared-order-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-diagnostics
            artifacts/release-setup
          if-no-files-found: error
          retention-days: 30
