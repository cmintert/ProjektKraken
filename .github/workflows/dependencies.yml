name: Dependency contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependency parser
        run: python -m pip install "packaging>=25"
      - name: Check generated inputs, startup coverage and Windows pins
        run: python -m scripts.check_dependencies
