name: Windows Beta Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing beta tag to rebuild and publish after approval"
        required: false
        type: string
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-beta[0-9]+"

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and smoke Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: packaging/windows/requirements.lock

      - name: Install hash-pinned packaging environment
        shell: pwsh
        run: python -m pip install --require-hashes -r packaging/windows/requirements.lock

      - name: Verify isolated environment
        shell: pwsh
        run: |
          $forbidden = @("pytest", "ruff", "mypy", "sphinx")
          foreach ($module in $forbidden) {
            python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('$module') else 0)"
          }

      - name: Run packaging contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests/packaging -p "test_*.py" -v

      - name: Resolve beta label
        shell: pwsh
        env:
          PK_REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $betaLabel = "beta1"
          $version = python -c "from src.core.version import VERSION; print(VERSION)"
          $releaseTag = $env:PK_REQUESTED_RELEASE_TAG
          if (-not $releaseTag -and $env:GITHUB_REF_TYPE -eq "tag") {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          if ($releaseTag) {
            if ($releaseTag -notmatch '^([0-9]+\.[0-9]+\.[0-9]+)-(beta[1-9][0-9]*)$') {
              throw "Unsupported beta tag: $releaseTag"
            }
            if ($Matches[1] -ne $version) {
              throw "Tag version $($Matches[1]) does not match runtime $version."
            }
            $betaLabel = $Matches[2]
          }
          "PK_BETA_LABEL=$betaLabel" >> $env:GITHUB_ENV
          "PK_RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV

      - name: Build, audit, smoke, and archive package
        shell: pwsh
        run: |
          ./scripts/build_windows_package.ps1 `
            -PythonExe (Get-Command python).Source `
            -BetaLabel $env:PK_BETA_LABEL

      - name: Upload package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-failure-diagnostics
          path: |
            artifacts/windows/staging/ProjektKraken/logs/*.log
            artifacts/windows/reports/*.json
            build/windows-package/pyinstaller.log
            build/windows-package/work/ProjektKraken/warn-ProjektKraken.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify tracked checkout stayed clean
        shell: pwsh
        run: |
          if (git status --porcelain --untracked-files=no) {
            git status --short
            throw "Packaging modified tracked files."
          }

      - name: Export artifact metadata
        id: metadata
        shell: pwsh
        run: |
          $version = python -c "from src.core.version import VERSION; print(VERSION)"
          "package_name=ProjektKraken-$version-$env:PK_BETA_LABEL-windows-x64" >> $env:GITHUB_OUTPUT
          "release_tag=$env:PK_RELEASE_TAG" >> $env:GITHUB_OUTPUT

      - name: Upload candidate package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.package_name }}
          path: |
            artifacts/windows/${{ steps.metadata.outputs.package_name }}.zip
            artifacts/windows/${{ steps.metadata.outputs.package_name }}.zip.sha256
            artifacts/windows/reports/*.json
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish approved GitHub prerelease
    if: needs.build-and-smoke.outputs.release_tag != ''
    needs: build-and-smoke
    runs-on: ubuntu-latest
    environment: windows-beta
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate beta tag
        shell: bash
        env:
          PK_RELEASE_TAG: ${{ needs.build-and-smoke.outputs.release_tag }}
        run: |
          if [[ "${PK_RELEASE_TAG}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta([1-9][0-9]*)$ ]]; then
            echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "${GITHUB_ENV}"
            echo "BETA_NUMBER=${BASH_REMATCH[2]}" >> "${GITHUB_ENV}"
          else
            echo "Unsupported beta tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Download verified candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-and-smoke.outputs.package_name }}
          path: release-assets

      - name: Create or update prerelease idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PK_PACKAGE_NAME: ${{ needs.build-and-smoke.outputs.package_name }}
          PK_RELEASE_TAG: ${{ needs.build-and-smoke.outputs.release_tag }}
        shell: bash
        run: |
          tag="${PK_RELEASE_TAG}"
          title="ProjektKraken ${RELEASE_VERSION} beta ${BETA_NUMBER}"
          notes="Unsigned Windows x64 beta package. Verify the supplied SHA-256 before extraction. Clean-VM validation is required before approving this protected environment."
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --prerelease --title "${title}" --notes "${notes}"
          else
            gh release create "${tag}" --prerelease --title "${title}" --notes "${notes}"
          fi
          gh release upload "${tag}" \
            "release-assets/${PK_PACKAGE_NAME}.zip" \
            "release-assets/${PK_PACKAGE_NAME}.zip.sha256" \
            --clobber
