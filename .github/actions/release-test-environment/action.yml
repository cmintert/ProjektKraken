name: Complete release test environment
description: Install the unchanged full dependency set and record setup overhead
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements/*.txt
          pyproject.toml
    - name: Install headless Qt libraries
      shell: bash
      run: |
        mkdir -p artifacts/release-setup
        start=$SECONDS
        sudo apt-get update -qq
        sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-xinerama0 libxkbcommon-x11-0
        echo "native_install_seconds=$((SECONDS-start))" > artifacts/release-setup/timing.txt
    - name: Install complete release dependencies
      shell: bash
      run: |
        start=$SECONDS
        python -m pip install -r requirements.txt
        echo "python_install_seconds=$((SECONDS-start))" >> artifacts/release-setup/timing.txt
        python -m pip freeze > artifacts/release-setup/packages.txt
