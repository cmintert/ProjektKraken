[project]
name = "ProjektKraken"
version = "0.18.8"
description = "Project Kraken - A Timeline/Wiki Application"
requires-python = ">=3.13"
authors = [
    {name = "Christian Mintert", email = "christian.mintert@example.com"}
]

dependencies = [
    "PySide6",
    "Pillow",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "bleach>=6.2,<7",
    "geojson>=3.0.0",
    "keyring>=25.6.0",
    "pyvis",
]
license = {text = "GPL-3.0-only"}



[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "tmp",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "ANN",
    "C901",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "PLR0915",
    "PLR2004",
]
ignore = [
    "ANN401", # Dynamically typed expressions (Any) are allowed
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Flag functions with cyclomatic complexity > 15 (default 10 is too strict for existing code)
max-complexity = 15

[tool.ruff.lint.pylint]
# Beta ratchet: prevent monolithic functions from returning while legacy
# complexity is reduced incrementally below Ruff's stricter default of 50.
max-statements = 150

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "PLR2004"]
"src/tests/**/*.py" = ["D", "PLR2004"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
warn_unused_configs = true

