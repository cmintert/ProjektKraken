[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers -v
markers =
    smoke: critical-path tests for fast CI feedback
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: fast unit tests
    integration: integration tests
    req(id): maps test to a requirement identifier
    bug(id): maps test to a defect/regression identifier
    real_qt_invoke: runs with the real QMetaObject.invokeMethod implementation
qt_api = pyside6
filterwarnings =
    ignore:waitForWindowShown is deprecated:DeprecationWarning

