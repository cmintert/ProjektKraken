# Install both hook types; commits are cheap, pushes are thoroughly verified.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff staged Python files
        entry: python -m ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: Format staged Python files
        entry: python -m ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: local-preflight
        name: Kraken pre-push quality gate
        entry: python -m scripts.preflight push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
